  <text x="114" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" fill="#3C3C37">Hold a key, speak, and your words land</text>
  <text x="114" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" fill="#3C3C37">in the app you already have open.</text>
  <text x="114" y="384" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#5F5F58">The speech model runs on your own computer.</text>
