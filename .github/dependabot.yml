version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # tauri build rejects npm/crate major-minor mismatches; bump these with their Rust crate by hand
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-major"]
