name: Release Please

# Merging the release-please PR is the release. This workflow opens that PR,
# and when the merge creates a draft release, builds unsigned installers
# (updater artifacts still minisign-signed) and publishes the draft.

on:
  push:
    branches: [main]

# Never cancel a run that may have created a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      # Labels use the issues API. The pinned action's README requires this
      # alongside contents and pull-requests.
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release-id.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Cargo.lock on the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          if printf '%s' "$PR_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            branch=$(printf '%s' "$PR_JSON" | jq -er '.headBranchName')
          else
            branch=$PR_JSON
            if printf '%s' "$branch" | jq -e 'type == "string"' >/dev/null 2>&1; then
              branch=$(printf '%s' "$branch" | jq -er '.')
            fi
          fi
          case "$branch" in
            release-please--*) ;;
            *)
              echo "unexpected release branch: ${branch}" >&2
              exit 1
              ;;
          esac
          git fetch --depth=1 origin "$branch"
          git checkout --detach FETCH_HEAD
          bash scripts/check-versions.sh --fix
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already matches"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: sync Cargo.lock coco-voice version"
          git push origin "HEAD:${branch}"

      - name: Get draft release id
        id: release-id
        if: steps.release.outputs.release_created == 'true'
        env:
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          set -euo pipefail
          id=$(printf '%s' "$UPLOAD_URL" | sed -nE 's#.*/releases/([0-9]+)/assets.*#\1#p')
          if ! printf '%s' "$id" | grep -Eq '^[0-9]+$'; then
            echo "expected a numeric release id in upload_url, got: ${UPLOAD_URL}" >&2
            exit 1
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      # Unsigned installers. createUpdaterArtifacts stays on so latest.json
      # and .sig files are still produced and minisign-signed.
      build-args: '${{ matrix.args }} --config ''{"bundle":{"macOS":{"signingIdentity":"-"},"windows":{"signCommand":null}}}'''
      sign-binaries: false
      sign-updater: true
      asset-prefix: "coco-voice"
      upload-artifacts: false
      release-id: ${{ needs.release-please.outputs.release_id }}
      ref: ${{ needs.release-please.outputs.tag_name }}
      no-cache: true
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  finalize:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true' && needs.publish.result == 'success'
    permissions:
      id-token: write
      attestations: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 1

      - name: Write and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber
          rm -f assets/SHA256SUMS
          (
            cd assets
            files=$(find . -type f -printf '%P\n' | sort)
            if [ -z "$files" ]; then
              echo "release ${TAG} has no assets" >&2
              exit 1
            fi
            printf '%s\n' "$files" | while IFS= read -r name; do
              sha256sum "$name"
            done > SHA256SUMS
            if [ ! -s SHA256SUMS ]; then
              echo "SHA256SUMS is empty" >&2
              exit 1
            fi
          )
          gh release upload "$TAG" assets/SHA256SUMS --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          paragraph='These builds are not signed or notarized. Verify downloads with SHA256SUMS. On macOS, right-click the app and choose Open the first time.'
          marker='<!-- coco-voice-release-notes -->'
          body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .body)
          if printf '%s' "$body" | grep -F -q "$marker"; then
            gh release edit "$TAG" --draft=false --latest
            exit 0
          fi
          {
            notes="src/content/release-notes/${version}.md"
            if [ -f "$notes" ]; then
              cat "$notes"
              printf '\n\n'
            fi
            printf '%s\n\n' "$paragraph"
            printf '%s\n' "$body"
            printf '%s\n' "$marker"
          } > "${RUNNER_TEMP}/release-body.md"
          gh release edit "$TAG" --notes-file "${RUNNER_TEMP}/release-body.md" --draft=false --latest
