# Dependabot bun PRs bump packages in bun.lock and leave the generated
# .nix/bun.nix and .nix/bun-lock-hash stale, so the nix-build check fails on
# every one of them. This regenerates the files and commits them back to the
# Dependabot branch.
#
# Two jobs, split by trust: `regen` runs npm code (check-nix-deps.ts calls
# `bunx bun2nix`) with a read-only token and no persisted credentials.
# `commit` runs no repo code and no npm code: only git and gh, plus the
# downloaded artifact files as data.
#
# It dispatches the checks itself because a push made with GITHUB_TOKEN starts
# no workflow runs; workflow_dispatch is the documented exception.
#
# ponytail: only nix-check and ci-ok are started on the bot commit, because it changes only the two generated .nix files, which only nix-build reads; title, code-quality and playwright ran on Dependabot's own commit; upgrade path: dispatch them too if the merge gate needs them on head.

name: dependabot bun.nix

on:
  pull_request:
    paths:
      - "bun.lock"

permissions: {}

concurrency:
  group: dependabot-bun-nix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.head_ref, 'dependabot/bun/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Pinned by SHA so a moved tag can't swap in other action code; this job's output gets committed.
      # Bun itself stays on latest on purpose: the output has to pass nix-check.yml's freshness check,
      # which regenerates with the latest Bun and bun2nix.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Regenerate .nix/bun.nix and .nix/bun-lock-hash
        run: bun scripts/check-nix-deps.ts
      - name: Check what changed
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          changed=$(git status --porcelain | awk '{print $2}')
          if [[ -z "$changed" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .nix/bun.nix|.nix/bun-lock-hash) ;;
              *)
                echo "::error::unexpected change outside .nix/bun.nix and .nix/bun-lock-hash: $path"
                exit 1
                ;;
            esac
          done <<< "$changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: bun-nix
          path: |
            .nix/bun.nix
            .nix/bun-lock-hash
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: regen
    if: needs.regen.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bun-nix
          path: .nix
      - name: Commit and push the regenerated files
        shell: bash
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          while IFS= read -r path; do
            case "$path" in
              .nix/bun.nix|.nix/bun-lock-hash) ;;
              *)
                echo "::error::refusing to commit unexpected path: $path"
                exit 1
                ;;
            esac
          done <<< "$(git status --porcelain | awk '{print $2}')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nix/bun.nix .nix/bun-lock-hash
          git commit -m "chore(nix): regenerate bun.nix" -m "Generated by scripts/check-nix-deps.ts from this branch's bun.lock."
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Start nix-build and ci-ok on the new head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          gh workflow run nix-check.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run ci-ok.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
